name = "LCManifolds"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LCManifolds"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "LCAnalysis"
git = "https://github.com/glaroton/LCAnalysis"
rev = "main"

[[lean_lib]]
name = "LCManifolds"
