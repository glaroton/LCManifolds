name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - name: Prepare memory for the documentation build
        run: |
          sudo fallocate -l 16G /mnt/docswap
          sudo chmod 600 /mnt/docswap
          sudo mkswap /mnt/docswap
          sudo swapon /mnt/docswap
          # Lake spawns `git` from a process with a large address space; without overcommit
          # the kernel refuses the fork (ENOMEM) even when memory is free.
          sudo sysctl -w vm.overcommit_memory=1
          free -h
      - uses: leanprover-community/docgen-action@v1
        with:
          # The API documentation goes to `site/docs`; the action does not deploy it, because
          # the home page is added below.
          homepage: site
          deploy: false
      - name: Build the home page from the README
        if: github.event_name == 'push'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet markdown
          "$RUNNER_TEMP/venv/bin/python" scripts/homepage.py . ${{ github.event.repository.name }} \
            site/docs/declarations/declaration-data.bmp site/index.html
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site/
          # The doc-gen action already uploads an artifact named `github-pages`.
          name: site-with-home-page
      - uses: actions/deploy-pages@v4
        if: github.event_name == 'push'
        with:
          artifact_name: site-with-home-page
